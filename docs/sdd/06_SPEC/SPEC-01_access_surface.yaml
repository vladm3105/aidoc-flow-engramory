# SPEC-01 — Access Surface & Authorization (C4-L3). Upstream: ADR-02, ADR-06.
metadata:
  schema_version: "1.0"
  document_type: "spec-document"
  layer: 6
  total_sections: 8
  deliverable_type: code
  c4_level: { value: component }
  id_standard: { format: "{doc_type}.{doc_id}.{section_id}.{hash}", hash_algorithm: SHA256, hash_length: 4 }
  tags: [spec-document, layer-6-artifact, shared-architecture]

id: SPEC-01
doc_id: SPEC-01
title: "Access Surface & Authorization"

document_control:
  status: Approved
  version: "1.5"
  date_created: "2026-06-22T00:00:00"
  last_updated: "2026-11-22T00:00:00"
  author: "Engramory team"
  component: "AccessSurface"
  tdd_ready_score: "98/100"

component_overview:
  description: |
    Single AccessSurface for scoped, audited agent reads/writes via thin transports (ADR-10):
    authenticated MCP gateway (prod) and `engramory` CLI (dev/CI). Authorizes per call,
    audits all decisions, enforces governed-write evidence, and fails closed.
    TRUST (ADR-10 dev-tier carve-out): prod builds ActorContext solely from gateway-verified
    OIDC claims (JWKS, async/sync revocation cache, strict claims, pre-body auth, no `?token=`);
    dev CLI builds local ActorContext only on loopback hosts when `--auth` is off under
    `ENGRAMORY_PROFILE=dev` (`--auth` with stdio is refused).
  architecture_decision: "@adr: ADR-02"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Agent --> AccessSurface
        AccessSurface --> AuthzService
        AccessSurface --> KnowledgeService
        AccessSurface --> MemoryService
        AccessSurface --> AuditSink
  language: "Python"
  dependencies:
    - { name: "MCP server lib", version: ">=current", purpose: "Expose tools to agents" }

interfaces:
  exports:
    - name: "memory_search"
      type: "async function"
      signature: "async def memory_search(ctx, query, *, scope='agent', tenant_id=None, domain_id=None, brain_variant=None, specialization=None, k=8, token_budget=2000, expand_graph=False, include_knowledge=False) -> list[MemoryHit]"
      description: "Scoped retrieval of L0 knowledge and L2 distilled memory within @threshold:PRD.01.perf.context_token_budget . Quarantined/superseded rows stay unreachable (EARS.01.03.b800)."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "memory_add"
      type: "async function"
      signature: "async def memory_add(ctx, *, content, kind='note', scope='agent', domain_id=None, specializations=None, brain_variant=None, metadata=None) -> str"
      description: "Append a poisoning-screened episode in caller scope with bounded content/metadata, domain_id, brain_variant, and specializations."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "StoreUnavailable"]
    - name: "memory_feedback"
      type: "async function"
      signature: "async def memory_feedback(ctx, retrieval_id, outcome) -> None"
      description: "Record outcome (useful|not_useful|harmful); enforces retrieval ownership, reverses prior applied_delta, requires >=2 agent_id harmful votes on shared scopes, and audits denials."
      errors: ["AuthzError"]
    - name: "memory_forget"
      type: "async function"
      signature: "async def memory_forget(ctx, memory_id, *, reason) -> None"
      description: "Soft-retire and supersede a memory within caller scope/ownership with audit reason."
      errors: ["AuthzError"]
    - name: "agent_profile_get"
      type: "async function"
      signature: "async def agent_profile_get(ctx) -> AgentProfile"
      description: "Load caller L3 identity profile (returns default on fresh store)."
      errors: ["AuthzError"]
    - name: "agent_profile_upsert"
      type: "async function"
      signature: "async def agent_profile_upsert(ctx, *, display_name=None, agent_type=None, role=None, domain_id=None, specializations=None, brain_config=None, standing_preferences=None) -> AgentProfile"
      description: "Governed L3 Virtual Employee profile upsert storing archetype, role, department_focus, specializations, and bounded preferences/brain_config."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "StoreUnavailable"]
    - name: "agent_roster_list"
      type: "async function"
      signature: "async def agent_roster_list(ctx, *, domain_id=None, agent_type=None, role=None, specialization=None, include_stats=True) -> list[dict[str, Any]]"
      description: "List and rank tenant Virtual Employee instances with active_skill_count and mean_confidence."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "agent_brain_export"
      type: "async function"
      signature: "async def agent_brain_export(ctx, *, domain_id=None, brain_variant=None, specialization=None, min_confidence=0.5, limit=100, redact_terms=()) -> dict[str, Any]"
      description: "Export scrubbed, tenant-neutral Brain Passport (engramory.brain_passport.v1) with canonical passport_sha256 digest."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "agent_brain_import"
      type: "async function"
      signature: "async def agent_brain_import(ctx, *, passport, evidence_ref, target_domain_id=None, brain_variant=None, redact_terms=(), verify_integrity=True, allow_type_override=False) -> dict[str, Any]"
      description: "Governed import of Brain Passport into private scope='agent' space verifying evidence_ref, passport_sha256, agent_type match, and poisoning guard."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "StoreUnavailable"]
    - name: "agent_brain_compare"
      type: "async function"
      signature: "async def agent_brain_compare(ctx, *, variant_a, variant_b, query=None, k=5, scope='agent', domain_id=None, specialization=None) -> dict[str, Any]"
      description: "Non-mutating comparison of two brain variants across aggregate feedback metrics and live hits (no memory_retrievals writes or count bumps)."
      errors: ["AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "agent_space_offboard"
      type: "async function"
      signature: "async def agent_space_offboard(ctx, *, evidence_ref, target_agent_id=None, reason='cross_tenant_reassignment', purge_episodes=True, retire_memories=True) -> dict[str, Any]"
      description: "Transactional offboarding of private scope='agent' memories, episodes, and L3 profile while preserving shared scopes."
      errors: ["AuthzError", "GovernedWriteRejected", "StoreUnavailable"]
    - name: "memory_promote"
      type: "async function"
      signature: "async def memory_promote(ctx, *, memory_id, target_scope, evidence_ref, target_domain_id=None, target_project_id=None, specializations=None) -> dict[str, Any]"
      description: "Governed ADR-07 scope promotion (agent->project->domain->space) with source visibility, dedup, and provenance."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "KeyError", "StoreUnavailable"]
    - name: "graph_neighbors"
      type: "async function"
      signature: "async def graph_neighbors(ctx, *, id, rel=None, depth=1, scope='project', domain_id=None) -> Sequence[Mapping[str, Any]]"
      description: "Scoped graph neighborhood traversal via GraphPort with PostgreSQL CTE fallback."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "context_slice"
      type: "async function"
      signature: "async def context_slice(ctx, *, task_id, depth=6, scope='project', domain_id=None, layers=None, max_tokens=2000) -> Sequence[Mapping[str, Any]]"
      description: "Deterministic SDD ancestor DAG slice within caller tenant/project/domain scope."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "blast_radius"
      type: "async function"
      signature: "async def blast_radius(ctx, *, doc_id, depth=6, scope='project', domain_id=None) -> Sequence[Mapping[str, Any]]"
      description: "Downstream SDD graph impact closure within caller tenant/project/domain scope."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "knowledge_search"
      type: "async function"
      signature: "async def knowledge_search(ctx, query, *, domain_id=None, query_vec=None, scope=None, modality=None, expand_graph=False, graph_depth=1, limit=5) -> list[KBSection]"
      description: "Scoped 3-leg hybrid RRF search (capped at MAX_K=100) over kb_sections with modality and GraphRAG expansion."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "knowledge_ingest"
      type: "async function"
      signature: "async def knowledge_ingest(ctx, *, doc_id, citation, text, evidence_ref, scope='project', version=1, modality='text', blob_sha256=None, blob_uri=None, media_metadata=None) -> str"
      description: "Governed L0 KB section upsert with scope check, poisoning screening, and evidence_ref."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "knowledge_ingest_batch"
      type: "async function"
      signature: "async def knowledge_ingest_batch(ctx, *, sections, evidence_ref, scope='project') -> list[str]"
      description: "Batch governed L0 KB section ingest with validation and poisoning screening."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "knowledge_ingest_files"
      type: "async function"
      signature: "async def knowledge_ingest_files(ctx, *, paths, evidence_ref, scope='project', domain_id=None, embed=True, project_graph=True, docling=False, repo_root=None, enforce_project_boundary=False) -> dict[str, list[str]]"
      description: "Governed file/dir knowledge ingest with poisoning screen and path confinement."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "knowledge_sync_git"
      type: "async function"
      signature: "async def knowledge_sync_git(ctx, *, repo_path, base_sha=None, head_sha=None, scope='project', enforce_project_boundary=False) -> dict[str, Any]"
      description: "Governed commit-differential git sync with upsert-before-delete semantics."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "sdd_ingest"
      type: "async function"
      signature: "async def sdd_ingest(ctx, *, sdd_root, evidence_ref, project_id=None, scope='project', reconcile=True, ingest_fn=None, enforce_project_boundary=False) -> dict[str, Any]"
      description: "Governed SDD YAML graph ingest with evidence_ref, scope check, and symlink confinement."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "knowledge_ingest_media"
      type: "async function"
      signature: "async def knowledge_ingest_media(ctx, *, file_path, evidence_ref, scope='project', domain_id=None, embed=True, project_graph=True, allowed_root=None, enforce_project_boundary=False) -> dict[str, Any]"
      description: "Governed multimodal ingest (regular binary/media files) to Chunked Blob CAS and graph."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "BlobTooLargeError", "StoreUnavailable"]
    - name: "docs_ingest_runbook"
      type: "async function"
      signature: "async def docs_ingest_runbook(ctx, *, doc, steps, evidence_ref, scope='project', _preauthorized=False) -> dict[str, Any]"
      description: "Governed runbook doc + step persistence with domain boundary and secret/injection screening."
      errors: ["GovernedWriteRejected", "AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "docs_slice_runbook"
      type: "async function"
      signature: "async def docs_slice_runbook(ctx, *, doc_id=None, alert_id=None, max_tier=None, scope='project', domain_id=None, include_memories=True, token_budget=2000, format='json') -> dict[str, Any]"
      description: "Token-budgeted executable runbook slicing across L0 steps and L2 memories."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "blob_put"
      type: "async function"
      signature: "async def blob_put(ctx, *, file_path=None, key=None, data=None, content_type='application/octet-stream', scope='project', metadata=None, allowed_root=None, enforce_project_boundary=False) -> dict[str, Any]"
      description: "Governed content-addressable blob write into kb_blobs / kb_blob_chunks(_large)."
      errors: ["AuthzError", "ValidationError", "BlobTooLargeError", "StoreUnavailable"]
    - name: "blob_head"
      type: "async function"
      signature: "async def blob_head(ctx, *, sha256, scope='project') -> dict[str, Any] | None"
