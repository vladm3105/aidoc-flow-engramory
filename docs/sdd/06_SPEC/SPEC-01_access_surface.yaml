      errors: ["AuthzError", "StoreUnavailable"]
    - name: "blob_get"
      type: "async function"
      signature: "async def blob_get(ctx, *, sha256, scope='project', max_bytes=16777216) -> bytes"
      description: "Project/tenant CAS blob read bounded by max_bytes."
      errors: ["AuthzError", "BlobNotFoundError", "BlobTruncatedError", "BlobIntegrityError", "BlobTooLargeError", "StoreUnavailable"]
