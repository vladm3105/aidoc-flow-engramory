      errors: ["ValidationError", "MemoryPoisoningError", "AuthzError", "StoreUnavailable"]
    - name: "memory_learning_health"
      type: "async function"
      signature: "async def memory_learning_health(ctx, *, project_id=None, limit=500, scope='project') -> dict[str, Any]"
