id: SPEC-01
doc_id: SPEC-01
title: "Access Surface & Authorization"

document_control:
  status: Approved
  version: "1.1"
  date_created: "2026-06-22T00:00:00"
  last_updated: "2026-11-13T00:00:00"
  author: "Engramory team"
  component: "AccessSurface"
  tdd_ready_score: "98/100"

component_overview:
  description: |
    The single access surface (AccessSurface) through which all agents read/write
    knowledge and memory, reached via thin transport faces (ADR-10): the MCP gateway
    is the authenticated production face; the `engramory` CLI is the dev/CI face.
    Faces add no logic — every call is authorized and scoped by agent/project/tenant,
    audited, and fails closed on uncertainty inside AccessSurface itself. Implements
    the governed-write gate for SDD-artifact writes.
    TRUST (ADR-10 dev-tier carve-out): in production, ActorContext is constructed
    exclusively from OIDC claims verified by the gateway; the one fenced exception is
    the dev tier, where the CLI (arrives with PLAN-002 Phase 2) builds ActorContext
    from local config — permitted only under ENGRAMORY_PROFILE=dev (single-tenant,
    local store; the factory's require_dev_profile fence lands with the CLI).
  architecture_decision: "@adr: ADR-02"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Agent --> AccessSurface
        AccessSurface --> AuthzService
        AccessSurface --> KnowledgeService
        AccessSurface --> MemoryService
        AccessSurface --> AuditSink
  language: "Python"
  dependencies:
    - { name: "MCP server lib", version: ">=current", purpose: "Expose tools to agents" }

interfaces:
  exports:
    - name: "memory_search"
      type: "async function"
      signature: "async def memory_search(ctx: ActorContext, query: str, *, scope: str = 'agent', tenant_id: str | None = None, domain_id: str | None = None, brain_variant: str | None = None, specialization: str | None = None, k: int = 8, token_budget: int | None = 2000, include_knowledge: bool = False, expand_graph: bool = False, graph_depth: int = 1) -> list[MemoryHit]"
      description: "Scoped retrieval of knowledge + distilled memory. Token budget defaults to @threshold:PRD.01.perf.context_token_budget . Deliberately does NOT expose include_advisory: advisory/quarantined memories are unreachable through the agent-facing surface (EARS.01.03.b800); include_advisory exists only on the internal MemoryPort/retrieve layer for ops and evaluation."
      errors: ["AuthzError: caller scope insufficient", "StoreUnavailable: fail closed"]
    - name: "memory_add"
      type: "async function"
      signature: "async def memory_add(ctx: ActorContext, content: str, *, kind: str = 'note', metadata: Mapping[str, Any] | None = None, scope: str = 'agent', domain_id: str | None = None, brain_variant: str | None = None, specializations: Sequence[str] | None = None) -> str"
      description: "Append an episode in the caller's scope with optional domain_id, brain_variant, and specializations."
      errors: ["AuthzError", "GovernedWriteRejected", "StoreUnavailable"]
    - name: "memory_feedback"
      type: "async function"
      signature: "async def memory_feedback(ctx: ActorContext, retrieval_id: RetrievalId, outcome: str) -> None"
      description: "Record a retrieval outcome (useful | not_useful | harmful); drives the SPEC-04 confidence-update rule via the memory_retrievals log (migration 0003)."
      errors: ["AuthzError"]
    - name: "memory_forget"
      type: "async function"
      signature: "async def memory_forget(ctx: ActorContext, memory_id: MemoryId, reason: str) -> None"
      description: "Retire a memory in the caller's scope: end-date + mark superseded (soft; provenance retained). Audited."
      errors: ["AuthzError"]
    - name: "agent_profile_get"
      type: "async function"
      signature: "async def agent_profile_get(ctx: ActorContext) -> AgentProfile"
      description: "Load the caller's L3 identity profile (MEMORY_DESIGN task step 1)."
      errors: ["AuthzError"]
    - name: "agent_profile_upsert"
      type: "async function"
      signature: "async def agent_profile_upsert(ctx: ActorContext, *, display_name: str | None = None, agent_type: str | None = None, role: str | None = None, domain_id: str | None = None, specializations: Sequence[str] | None = None, brain_config: Mapping[str, Any] | None = None, standing_preferences: Mapping[str, Any] | None = None) -> AgentProfile"
      description: "Governed L3 Virtual Employee profile upsert storing agent_type, role, department_focus (domain_id), specializations, and brain_config in standing_preferences after poisoning screening."
      errors: ["AuthzError", "GovernedWriteRejected", "StoreUnavailable"]
    - name: "agent_roster_list"
      type: "async function"
      signature: "async def agent_roster_list(ctx: ActorContext, *, domain_id: str | None = None, agent_type: str | None = None, role: str | None = None, specialization: str | None = None, include_stats: bool = True) -> list[dict[str, Any]]"
      description: "List and rank Virtual Employee instances in the caller's tenant filtered by domain_id, agent_type, role, or specialization with live active_skill_count and mean_confidence statistics."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "agent_brain_export"
      type: "async function"
      signature: "async def agent_brain_export(ctx: ActorContext, *, domain_id: str | None = None, brain_variant: str | None = None, specialization: str | None = None, limit: int = 100, redact_terms: Sequence[str] = ()) -> dict[str, Any]"
      description: "Export a sanitized, tenant-neutral Virtual Employee Brain Passport (engramory.brain_passport.v1) with recursive PII scrubbing, brain_metadata, specializations, and canonical passport_sha256 digest."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "agent_brain_import"
      type: "async function"
      signature: "async def agent_brain_import(ctx: ActorContext, *, passport: Mapping[str, Any], evidence_ref: str | None, target_domain_id: str | None = None, brain_variant: str | None = None, redact_terms: Sequence[str] = (), verify_integrity: bool = True, allow_type_override: bool = False) -> dict[str, Any]"
      description: "Import a sanitized Brain Passport into the caller's private scope='agent' memory space after verifying evidence_ref, passport_sha256 integrity, agent_type compatibility, and poisoning guard checks."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "StoreUnavailable"]
    - name: "agent_brain_compare"
      type: "async function"
      signature: "async def agent_brain_compare(ctx: ActorContext, *, variant_a: str, variant_b: str, query: str | None = None, k: int = 5, scope: str = 'agent', domain_id: str | None = None, specialization: str | None = None) -> dict[str, Any]"
      description: "Compare two multi-model brain variants (variant_a vs. variant_b) across skill count, confidence, token efficiency, retrieval feedback useful_rate, and optional live query hit overlap."
      errors: ["AuthzError", "ValidationError", "StoreUnavailable"]
    - name: "agent_space_offboard"
      type: "async function"
      signature: "async def agent_space_offboard(ctx: ActorContext, *, evidence_ref: str | None, reason: str = 'cross_tenant_reassignment', purge_episodes: bool = True, retire_memories: bool = True) -> dict[str, Any]"
      description: "Governed transactional offboarding of a Virtual Employee's private scope='agent' memories, private episodes, and L3 profile on the old tenant while preserving shared project/domain/space artifacts."
      errors: ["AuthzError", "GovernedWriteRejected", "StoreUnavailable"]
    - name: "memory_promote"
      type: "async function"
      signature: "async def memory_promote(ctx: ActorContext, *, memory_id: str, target_scope: str, evidence_ref: str | None, target_domain_id: str | None = None, target_project_id: str | None = None, specializations: Sequence[str] | None = None) -> dict[str, Any]"
      description: "Governed promotion of a validated L2 memory up the ADR-07 scope ladder (agent -> project -> domain -> space) with strict source visibility, cross-instance deduplication, and provenance."
      errors: ["AuthzError", "GovernedWriteRejected", "ValidationError", "KeyError", "StoreUnavailable"]
    - name: "knowledge_search"
      type: "async function"
      signature: "async def knowledge_search(ctx: ActorContext, query: str, *, limit: int = 8, scope: str = 'project', domain_id: str | None = None, modality: str | None = None, expand_graph: bool = False, graph_depth: int = 1) -> list[dict[str, Any]]"
      description: "Scoped 3-leg hybrid RRF search over L0 kb_sections with optional modality filtering and GraphRAG expansion."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "knowledge_ingest"
      type: "async function"
      signature: "async def knowledge_ingest(ctx: ActorContext, entry: KBEntryIn, evidence_ref: str | None) -> EntryId"
      description: "Create/update an SDD-artifact KB entry; requires evidence_ref (governed write)."
      errors: ["GovernedWriteRejected: missing/invalid evidence_ref", "AuthzError"]
    - name: "knowledge_ingest_media"
      type: "async function"
      signature: "async def knowledge_ingest_media(ctx: ActorContext, *, file_path: Path, evidence_ref: str | None, scope: str = 'project', embed: bool = True, project_graph: bool = True) -> dict[str, Any]"
      description: "Governed multimodal ingestion (image, audio, 20 GB+ video, PDF/Office) streaming raw bytes into PostgreSQL 18 Chunked Blob CAS (Rule D14b) and indexing time/region-coded KBSection rows + Neo4j/PG graph projections."
      errors: ["GovernedWriteRejected", "AuthzError", "BlobTooLargeError", "StoreUnavailable"]
    - name: "blob_put"
      type: "async function"
      signature: "async def blob_put(ctx: ActorContext, *, file_path: Path | None = None, data: bytes | None = None, content_type: str = 'application/octet-stream', scope: str = 'project', metadata: Mapping[str, Any] | None = None) -> dict[str, Any]"
      description: "Governed content-addressable blob write into kb_blobs / kb_blob_chunks(_large)."
      errors: ["AuthzError", "BlobTooLargeError", "StoreUnavailable"]
    - name: "blob_head"
      type: "async function"
      signature: "async def blob_head(ctx: ActorContext, *, sha256: str, scope: str = 'project') -> dict[str, Any] | None"
      description: "Tenant-scoped manifest + chunk completeness inspection for a SHA-256 blob."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "blob_get"
      type: "async function"
      signature: "async def blob_get(ctx: ActorContext, *, sha256: str, scope: str = 'project') -> bytes"
      description: "Tenant-scoped content-addressable blob read (bounded bytes or streamed via StoragePort.get_stream)."
      errors: ["AuthzError", "BlobNotFoundError", "BlobTruncatedError", "BlobIntegrityError", "StoreUnavailable"]
    - name: "memory_ingest_event"
      type: "async function"
      signature: "async def memory_ingest_event(ctx: ActorContext, event_data: Mapping[str, Any] | ExperienceEvent) -> dict[str, Any]"
      description: "Validate, screen, and persist a structured ExperienceEvent into L1 episodes."
      errors: ["ValidationError", "MemoryPoisoningError", "AuthzError", "StoreUnavailable"]
    - name: "memory_learning_health"
      type: "async function"
      signature: "async def memory_learning_health(ctx: ActorContext, *, project_id: str | None = None, limit: int = 500) -> dict[str, Any]"
      description: "Compute closed-loop learning effectiveness metrics over recent tenant episodes."
      errors: ["AuthzError", "StoreUnavailable"]
    - name: "authorize"
      type: "function"
      signature: "def authorize(ctx: ActorContext, action: str, target_scope: Scope) -> AuthzDecision"
      description: "Per-call scope authorization; default deny."
      errors: []

data_models:
  models:
    - name: "ActorContext"
      type: "dataclass"
      fields:
        - { name: "agent_id", type: "str", required: true, description: "Calling agent identity" }
        - { name: "project_id", type: "str", required: true, description: "Project scope" }
        - { name: "tenant_id", type: "str", required: true, description: "Tenant scope" }
        - { name: "scopes", type: "set[str]", required: true, description: "Granted scopes (agent|project|domain|space) per @adr: ADR-07" }
        - { name: "domain_id", type: "str | None", required: false, description: "Optional department/domain focus (e.g. billing, security, platform)" }
    - name: "AuthzDecision"
      type: "dataclass"
      fields:
        - { name: "allowed", type: "bool", required: true, description: "Allow/deny" }
        - { name: "reason", type: "str", required: true, description: "Decision reason (for audit)" }
    - name: "AuditRecord"
      type: "dataclass"
      fields:
        - { name: "actor", type: "ActorContext", required: true, description: "Caller" }
        - { name: "action", type: "str", required: true, description: "Operation" }
        - { name: "decision", type: "AuthzDecision", required: true, description: "Allow/deny + reason" }
        - { name: "ts", type: "datetime", required: true, description: "Timestamp" }

behavior:
  validation_rules:
    - { rule: "Every read/write is authorized and scoped by agent/project/tenant before execution", source: "@ears: EARS.01.03.e020" }
    - { rule: "SDD-artifact writes require a valid approved-evidence reference", source: "@ears: EARS.01.03.a700" }
  state_transitions:
    - { from: "Received", to: "Denied", trigger: "scope check fails OR missing evidence", source: "@bdd: BDD.01.03.e500" }
    - { from: "Received", to: "Executed", trigger: "authorized", source: "@bdd: BDD.01.03.a100" }
  error_handling:
    - { condition: "Out-of-scope request", response: "Deny, return no data, write AuditRecord within 200 ms", source: "@bdd: BDD.01.03.e500" }
    - { condition: "Governed write without evidence", response: "Reject + audit within 200 ms", source: "@bdd: BDD.01.03.f600" }
    - { condition: "Canonical store unavailable", response: "Fail closed; retryable error within 500 ms", source: "@bdd: BDD.01.03.b800" }

implementation_notes:
  constraints: ["Stateless request handlers", "Default-deny authorization", "Fail closed on any uncertainty"]
  patterns: ["Policy enforcement point at the surface", "Structured audit for every authz decision"]
  performance_considerations: ["Authz must not dominate retrieval p95 budget"]

tdd_contracts:
  tdd_document: "@tdd: TDD-01"
  test_files:
    - { path: "tests/unit/test_authz.py", covers: "authorize() default-deny + scope checks" }
    - { path: "tests/integration/test_access_surface.py", covers: "tool calls + audit emission" }
    - { path: "tests/e2e/test_scope_isolation.py", covers: "BDD.01.03.e500 cross-tenant deny" }
    - { path: "tests/e2e/test_retrieval.py", covers: "BDD.01.03.a100 scoped retrieval e2e" }
    - { path: "tests/security/test_failclosed.py", covers: "TDD.01.04.d400 fail-closed on store loss" }
    - { path: "tests/test_virtual_employee_lifecycle.py", covers: "Virtual Employee hierarchy, multi-model brain variants, Brain Passports, and offboarding" }

