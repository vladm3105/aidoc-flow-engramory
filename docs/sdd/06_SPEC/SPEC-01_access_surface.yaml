      errors: ["AuthzError", "StoreUnavailable"]
    - name: "audit_denial"
      type: "async function"
      signature: "async def audit_denial(ctx, action, reason) -> None"
      description: "Record structured fail-closed authorization denial audit event."
      errors: ["StoreUnavailable"]
    - name: "authorize"
      type: "function"
      signature: "def authorize(ctx, action, target) -> AuthzDecision"
      description: "Per-call scope authorization; default deny."
      errors: []

data_models:
  models:
    - name: "ActorContext"
      type: "dataclass"
      fields:
        - { name: "agent_id", type: "str", required: true, description: "Agent ID" }
        - { name: "project_id", type: "str", required: true, description: "Project scope" }
        - { name: "tenant_id", type: "str", required: true, description: "Tenant scope" }
        - { name: "scopes", type: "frozenset[str]", required: true, description: "Granted scopes (agent|project|domain|space) per @adr: ADR-07" }
        - { name: "domain_id", type: "str | None", required: false, description: "Department/domain focus" }
    - name: "AuthzDecision"
      type: "dataclass"
      fields:
        - { name: "allowed", type: "bool", required: true, description: "Allow/deny" }
        - { name: "reason", type: "str", required: true, description: "Decision reason" }
    - name: "AuditRecord"
      type: "dataclass"
      fields:
        - { name: "actor", type: "ActorContext", required: true, description: "Caller" }
        - { name: "action", type: "str", required: true, description: "Operation" }
        - { name: "decision", type: "AuthzDecision", required: true, description: "Decision" }
        - { name: "ts", type: "datetime", required: true, description: "Timestamp" }

behavior:
  validation_rules:
    - { rule: "Every read/write is authorized and scoped by agent/project/tenant before execution", source: "@ears: EARS.01.03.e020" }
    - { rule: "SDD-artifact writes require a valid approved-evidence reference (enforced on sdd_ingest and memory/docs ingest)", source: "@ears: EARS.01.03.a700" }
    - { rule: "Agent offboarding (agent_space_offboard) enforces same-agent/explicit-admin authz, audits denials, and never soft-deletes space-scoped shared memories", source: "@ears: EARS.01.03.e020" }
    - { rule: "Documentation smoke runners execute only strict shlex-allowlisted non-shell commands with scrubbed env and symlink-free workspace confinement", source: "@ears: EARS.01.04.c300" }
    - { rule: "MCP Brain Passport import hard-enforces verify_integrity=True, allow_type_override=False, single-transaction dedup, and schema_version; department_focus and docs_ingest_runbook enforce _enforce_domain_boundary", source: "@ears: EARS.01.03.e020" }
    - { rule: "MCP gateway supports ping/notifications, thread-offloaded blocking tools, cross-platform stdio, blob_put/blob_get, accurate readOnlyHint, and bounded dependency readiness probes on /health and /ready (503 when canonical store is unreachable)", source: "@ears: EARS.01.03.e020" }
  state_transitions:
    - { from: "Received", to: "Denied", trigger: "scope check fails OR missing evidence", source: "@bdd: BDD.01.03.e500" }
    - { from: "Received", to: "Executed", trigger: "authorized", source: "@bdd: BDD.01.03.a100" }
  error_handling:
    - { condition: "Out-of-scope request", response: "Deny, return no data, write AuditRecord within 200 ms", source: "@bdd: BDD.01.03.e500" }
    - { condition: "Governed write without evidence", response: "Reject + audit within 200 ms", source: "@bdd: BDD.01.03.f600" }
    - { condition: "Canonical store unavailable", response: "Fail closed; retryable error within 500 ms", source: "@bdd: BDD.01.03.b800" }

implementation_notes:
  constraints: ["Stateless request handlers", "Default-deny authorization", "Fail closed on any uncertainty"]
  patterns: ["Policy enforcement point at the surface", "Structured audit for every authz decision"]
  performance_considerations: ["Authz must not dominate retrieval p95 budget"]

tdd_contracts:
  tdd_document: "@tdd: TDD-01"
  test_files:
    - { path: "tests/unit/test_authz.py", covers: "authorize() default-deny + scope checks" }
    - { path: "tests/integration/test_access_surface.py", covers: "tool calls + audit emission" }
    - { path: "tests/e2e/test_scope_isolation.py", covers: "BDD.01.03.e500 cross-tenant deny" }
    - { path: "tests/e2e/test_retrieval.py", covers: "BDD.01.03.a100 scoped retrieval e2e" }
    - { path: "tests/security/test_failclosed.py", covers: "TDD.01.04.d400 fail-closed on store loss" }
    - { path: "tests/test_virtual_employee_lifecycle.py", covers: "Virtual Employee hierarchy, multi-model brain variants, Brain Passports, and offboarding" }

traceability:
  tags: ["@spec: SPEC-01"]
  upstream:
    adr_references: ["@adr: ADR.02.03.a100", "@adr: ADR.06.03.a100", "@adr: ADR-07", "@adr: ADR-10"]
    bdd_references: ["@bdd: BDD.01.03.e500", "@bdd: BDD.01.03.f600", "@bdd: BDD.01.03.a100"]
    ears_references: ["@ears: EARS.01.03.e020", "@ears: EARS.01.03.f600", "@ears: EARS.01.03.a700", "@ears: EARS.01.03.b050"]
  downstream:
    - { type: TDD, layer: 7, description: "Test cases for authz + governed-write + fail-closed" }
    - { type: IPLAN, layer: 8, description: "Implementation plan for the access surface" }
  health_score: { tdd_ready: "[Pending]%", target_score: ">=90/100" }
