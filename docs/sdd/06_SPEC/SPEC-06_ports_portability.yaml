  tdd_ready_score: "95/100"

component_overview:
  description: |
    The vendor-neutral stdlib-only port interfaces the core depends on, their per-environment adapters
    (`ACTIVE_PROFILES`: `dev`, `stage` | `PLANNED_PROFILES`: `gcp`, `azure`) selected by `ENGRAMORY_PROFILE`
    (where `"stage"` binds self-hosted Postgres/Neo4j/NATS/LiteLLM adapters while ADR-10 `require_dev_profile`
    still refuses non-`"dev"` CLI execution, and `gcp`/`azure` raise `NotImplementedError` until `BRD-02`),
    alongside explicit status distinguishing the 5 active ports (`StoragePort`, `VectorPort`, `GraphPort`,
    `LLMPort`, `EventsPort`) from 3 planned/deferred ports (`CachePort`, `SecretsPort`, `MemoryPort`).
  architecture_decision: "@adr: ADR-02"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Core --> Ports
        Ports --> ActiveDevStageAdapters
        Ports --> PlannedCloudProfiles
  language: "Python"
  dependencies: []

interfaces:
  exports:
    - name: "StoragePort"
      type: "class"
      signature: "class StoragePort(Protocol): ..."
      description: "[ACTIVE] Project- and tenant-scoped content-addressable blob storage (PgBlobStorageAdapter with advisory CAS locks, kb_blob_projects ownership, contiguous chunk verification & bounded get(max_bytes) | LocalFsStorageAdapter with on-disk chunk persistence & mtime GC | planned: GCS, Azure Blob): put/get/delete/exists/put_file/put_stream/get_stream/head/reconcile_truncated_blobs/gc_orphan_chunks."
      errors: ["StorageError", "BlobNotFoundError", "BlobTruncatedError", "BlobIntegrityError", "BlobTooLargeError"]
    - name: "VectorPort"
      type: "class"
      signature: "class VectorPort(Protocol): ..."
      description: "[ACTIVE] Vector index (rebuildable projection). Enforces explicit tenant_id on upsert/search/delete, validates 1536-dim vectors in PgVectorAdapter, and filters active non-expired rows (valid_to IS NULL AND status = 'active')."
      errors: []
    - name: "GraphPort"
      type: "class"
      signature: "class GraphPort(Protocol): ..."
      description: "[ACTIVE] Dual-engine graph traversal (Neo4j Adopt via Neo4jGraphAdapter per Decision D17 with PostgreSQL 18 recursive CTE fallback). Enforces tenant_id + allowed_scopes + project_id/domain_id + exclude_kb_labels filtering on all traversals/deletes, strips reserved identity keys before $props writes, and rejects ':' in tenant_id."
      errors: []
    - name: "CachePort"
      type: "class"
      signature: "class CachePort(Protocol): ..."
      description: "[PLANNED/DEFERRED -> BRD-02] Optional session/L1 cache protocol (Valkey | Memorystore | Azure Cache); zero runtime consumers in v0.3.0."
      errors: []
    - name: "LLMPort"
      type: "class"
      signature: "class LLMPort(Protocol): ..."
      description: "[ACTIVE] Embeddings (including explicit 1536 dimensions), text generation, vision captioning (describe_image), and audio ASR transcription (transcribe_audio) via LiteLLMAdapter gateway."
      errors: []
    - name: "SecretsPort"
      type: "class"
      signature: "class SecretsPort(Protocol): ..."
      description: "[PLANNED/DEFERRED -> BRD-02] Stage secret delivery uses OpenBao Path C (/dev/shm ephemeral env injection via platform-stage-ops); runtime adapter deferred to Cloud Secret Manager / Key Vault."
      errors: []
    - name: "EventsPort"
      type: "class"
      signature: "class EventsPort(Protocol): ..."
      description: "[ACTIVE] Events (NATS JetStream durable pull consumers & PubAck via NatsEventsAdapter with automatic reconnect, CRLF header validation, strict token wildcards, and broker subject-to-tenant binding | planned: Pub/Sub, Service Bus)."
      errors: []
    - name: "MemoryPort"
      type: "class"
      signature: "class MemoryPort(Protocol): ..."
      description: "[PLANNED/DEFERRED -> BRD-07] Pluggable memory accelerator protocol (LangMem | Cipher | Mem0) over PostgreSQL canonical; v0.3.0 distillation runs natively in workers/distillation.py over Repository."
      errors: []
    - name: "reembed_and_reproject"
      type: "async function"
      signature: "async def reembed_and_reproject(profile: str) -> MigrationReport  # PLANNED -> BRD-02 / BRD-07"
      description: "[PLANNED/DEFERRED -> BRD-02/BRD-07] Offline re-embed & rebuild graph helper (current graph rebuild runs via `engramory graph reproject`)."
      errors: []

data_models:
  models:
    - name: "MigrationReport"
      type: "dataclass"
      fields:
        - { name: "reembedded", type: "int", required: true, description: "Memories re-embedded" }
        - { name: "graph_rebuilt", type: "bool", required: true, description: "Graph re-projected" }

behavior:
  validation_rules:
    - { rule: "Managed accelerator used as cache only; canonical store remains source of truth", source: "@ears: EARS.01.03.d010" }
    - { rule: "Embeddings/graph are rebuildable projections of canonical text", source: "@ears: EARS.01.03.a040" }
  state_transitions:
    - { from: "Profile=dev|stage", to: "Profile=gcp|azure", trigger: "adapter selection at cloud migration (BRD-02)", source: "@bdd: BDD.01.03.d010" }
  error_handling:
    - { condition: "Adapter unavailable", response: "Fail closed; surface retryable error", source: "@bdd: BDD.01.03.b800" }

implementation_notes:
  constraints: ["ports/ imports stdlib modules only; core/, workers/, mcp/, access/ never import cloud vendor SDKs or engramory.adapters; PostgreSQL driver (psycopg/psycopg_pool) is spine infrastructure restricted to core/repository + dev vector/storage adapters", "Adapter set chosen via adapters_for_profile(ENGRAMORY_PROFILE) and deterministically closed on the owning event loop"]
  patterns: ["Hexagonal ports & adapters", "Adapter conformance test suite shared across environments"]
  performance_considerations: ["Pooled PostgreSQL connections (psycopg_pool.AsyncConnectionPool) bounded by connection/statement timeouts"]

tdd_contracts:
  tdd_document: "@tdd: TDD-06"
  test_files:
    - { path: "tests/conformance/test_adapters.py", covers: "active dev adapter conformance & fail-closed parity" }
    - { path: "tests/test_ports.py", covers: "8 declared Port Protocols and method signatures" }
    - { path: "tests/unit/test_no_vendor_imports.py", covers: "ports/ stdlib-only & access/core layer purity" }

