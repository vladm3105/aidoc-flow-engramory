id: SPEC-04
doc_id: SPEC-04
title: "Distillation Engine"

document_control:
  status: Draft
  version: "1.0"
  date_created: "2026-06-22T00:00:00"
  last_updated: "2026-06-22T00:00:00"
  author: "Engramory team"
  component: "DistillationEngine"
  tdd_ready_score: "[Pending]/100"

component_overview:
  description: |
    Background worker that runs reflection (episodes → long-term memory) and consolidation
    (merge, generalize, end-date, quarantine low-confidence). Uses LLMPort for summarization/
    embedding. Emits observable consolidation_run records. May wrap an external memory engine
    (LangMem/Cipher/Mem0) as the MemoryPort adapter, with Postgres canonical.
  architecture_decision: "@adr: ADR-05"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Scheduler --> DistillationEngine
        DistillationEngine --> MemoryStore
        DistillationEngine --> LLMPort
        DistillationEngine --> AuditSink
  language: "Python"
  dependencies:
    - { name: "LLMPort (SPEC-06)", version: "internal", purpose: "Summarize/embed via gateway" }
    - { name: "MemoryStore (SPEC-02)", version: "internal", purpose: "Read episodes / write memories" }

interfaces:
  exports:
    - name: "reflect"
      type: "async function"
      signature: "async def reflect(agent_id: str, project_id: str | None) -> int"
      description: "Promote recent episodes into distilled long-term memories. Returns count. Port binding: MemoryPort.reflect (renamed from distill, PLAN-001). Validate this batch-reflect surface against the adopted engine's API (Mem0 write-time ADD/UPDATE/DELETE/NOOP) before building the adapter (IPLAN-04 precondition)."
      errors: ["LLMUnavailable: retryable"]
    - name: "consolidate"
      type: "async function"
      signature: "async def consolidate(agent_id: str) -> ConsolidationStats"
      description: "Compact long-term memory: merge/generalize/end-date/quarantine."
      errors: ["LLMUnavailable: retryable"]

data_models:
  models:
    - name: "ConsolidationStats"
      type: "dataclass"
      fields:
        - { name: "merged", type: "int", required: true, description: "Memories merged" }
        - { name: "expired", type: "int", required: true, description: "End-dated facts" }
        - { name: "quarantined", type: "int", required: true, description: "Low-confidence lessons" }
        - { name: "run_id", type: "str", required: true, description: "Observable consolidation_run id" }
    - name: "ExperienceEvent"
      type: "dataclass"
      fields:
        - { name: "kind", type: "str", required: true, description: "One of the 9 canonical milestone kinds (plan.authored, review.verdict, execution.completed, gate.failed, decision.recorded, lesson.proposed, feedback.received, feedback.routed, feedback.quarantined)" }
        - { name: "event_id", type: "str", required: false, description: "Deterministic UUIDv5 derived via derive_experience_event_id()" }
        - { name: "origin", type: "OriginProvenance | None", required: false, description: "Source provenance (repo + commit/pr/plan_id/chg_id/run_id + optional W3C trace_id) propagated into Memory.provenance during reflect()" }
        - { name: "effectiveness_score", type: "float | None", required: false, description: "Optional closed-loop learning score in [0, 1] overriding default initial confidence 0.6 in reflect()" }

behavior:
  validation_rules:
    - { rule: "Consolidation runs every @threshold:PRD.01.rate.consolidation_cadence (20 new memories)", source: "@ears: EARS.01.03.d400" }
    - { rule: "Low-confidence lessons marked advisory-only, provenance retained", source: "@ears: EARS.01.03.b800" }
    - { rule: "Reflection triggers: >=10 unprocessed episodes OR 30 min elapsed since the first unprocessed episode OR an explicit reflect() call — never 'project end' alone (continuous agents have no project end)", source: "@bdd: BDD.01.03.d400" }
    - { rule: "Confidence dynamics: distiller assigns initial confidence in [0,1]; on each feedback outcome v (useful=1.0, not_useful=0.25, harmful=0.0): c := clamp(c + 0.2*(v - c), 0, 1); status:='advisory' when c < 0.4, restored to 'active' when c >= 0.5 (hysteresis); a 'harmful' outcome sets status:='quarantined' immediately", source: "@ears: EARS.01.03.b800" }
    - { rule: "Secrets screen: before any episode or memory write, content is screened for credential material (key/token/password patterns + high-entropy strings); matches are rejected (or the span redacted) and an audit_records row is written", source: "@ears: EARS.01.04.c300" }
  state_transitions:
    - { from: "Episodes", to: "DistilledMemory", trigger: "reflection pass", source: "@bdd: BDD.01.03.d400" }
    - { from: "Lesson", to: "AdvisoryOnly", trigger: "confidence < floor", source: "@bdd: BDD.01.03.a700" }
  error_handling:
    - { condition: "LLM gateway unavailable", response: "Retry with backoff; no partial writes (at-least-once per episode, idempotent)", source: "@bdd: BDD.01.03.d400" }

implementation_notes:
  constraints: ["Idempotent per episode (content hash)", "No deletes — end-date/supersede", "Keep content_raw for re-embedding"]
  patterns: ["Reflection then periodic consolidation ('sleep')", "Pluggable MemoryPort engine over Postgres canonical"]
  performance_considerations: ["Batch LLM calls; cap consolidation working set"]

tdd_contracts:
  tdd_document: "@tdd: TDD-04"
  test_files:
    - { path: "tests/unit/test_distillation_worker.py", covers: "episode -> memory reflection, consolidation, and worker loop" }
    - { path: "tests/unit/test_experience_pipeline.py", covers: "ExperienceEvent provenance propagation and effectiveness scoring" }

