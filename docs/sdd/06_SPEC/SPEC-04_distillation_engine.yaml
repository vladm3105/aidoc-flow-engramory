id: SPEC-04
doc_id: SPEC-04
title: "Distillation Engine"

document_control:
  status: Approved
  version: "1.3"
  date_created: "2026-06-22T00:00:00"
  last_updated: "2026-11-22T00:00:00"
  author: "Engramory team"
  component: "DistillationEngine"
  tdd_ready_score: "95/100"

component_overview:
  description: |
    Background worker that runs reflection (episodes -> long-term memory) and consolidation
    (merge, generalize, end-date, quarantine low-confidence). Uses LLMPort for summarization/
    embedding. Emits observable consolidation_run records. Built natively over PostgreSQL 18
    canonical storage (`workers/distillation.py` + `workers/runner.py`), while optional external
    `MemoryPort` acceleration remains planned/deferred (`BRD-07`).
  architecture_decision: "@adr: ADR-05"
  diagram:
    tags: ["@diagram: c4-l3", "@diagram: dfd-l3"]
    mermaid: |
      flowchart LR
        Scheduler --> DistillationEngine
        DistillationEngine --> MemoryStore
        DistillationEngine --> LLMPort
        DistillationEngine --> AuditSink
  language: "Python"
  dependencies:
    - { name: "LLMPort (SPEC-06)", version: "internal", purpose: "Summarize/embed via gateway" }
    - { name: "MemoryStore (SPEC-02)", version: "internal", purpose: "Read episodes / write memories" }

interfaces:
  exports:
    - name: "reflect"
      type: "async function"
      signature: "async def reflect(repo: Repository, *, tenant_id: str, agent_id: str, llm: LLMPort | None = None, vector: VectorPort | None = None, batch_size: int = 32, brain_variant: str | None = None, distiller_model: str | None = None, rag_params: Mapping[str, Any] | None = None) -> int"
      description: "Promote unreflected episodes into distilled long-term memories with optional brain_variant/distiller_model summarization and retried embedding projection. Returns count created."
      errors: ["LLMUnavailable: retryable"]
    - name: "consolidate"
      type: "async function"
      signature: "async def consolidate(repo: Repository, *, tenant_id: str, agent_id: str | None = None, project_id: str | None = None, domain_id: str | None = None, scope: str | None = None, expire_below_confidence: float = 0.2, min_age_days: int = 30) -> ConsolidationStats"
      description: "Compact long-term memory: deduplicate/merge duplicates, expire stale low-confidence memories, and record consolidation_runs."
      errors: ["LLMUnavailable: retryable"]

data_models:
  models:
    - name: "ConsolidationStats"
      type: "dataclass"
      fields:
        - { name: "tenant_id", type: "str", required: true, description: "Tenant namespace of the consolidation run" }
        - { name: "agent_id", type: "str | None", required: false, description: "Optional scoped agent id" }
        - { name: "merged", type: "int", required: true, description: "Memories merged/superseded" }
        - { name: "expired", type: "int", required: true, description: "Low-confidence memories end-dated" }
        - { name: "run_id", type: "str | None", required: false, description: "Observable consolidation_run id when persisted" }
    - name: "ExperienceEvent"
      type: "dataclass"
      fields:
        - { name: "kind", type: "str", required: true, description: "One of the 9 canonical milestone kinds (plan.authored, review.verdict, execution.completed, gate.failed, decision.recorded, lesson.proposed, feedback.received, feedback.routed, feedback.quarantined)" }
        - { name: "event_id", type: "str", required: false, description: "Deterministic UUIDv5 derived via derive_experience_event_id()" }
        - { name: "origin", type: "OriginProvenance | None", required: false, description: "Source provenance (repo + commit/pr/plan_id/chg_id/run_id + optional W3C trace_id) propagated into Memory.provenance during reflect()" }
        - { name: "effectiveness_score", type: "float | None", required: false, description: "Optional closed-loop learning score in [0, 1] overriding default initial confidence 0.6 in reflect()" }

behavior:
  validation_rules:
    - { rule: "Consolidation runs every @threshold:PRD.01.rate.consolidation_cadence (20 new memories)", source: "@ears: EARS.01.03.d400" }
    - { rule: "Low-confidence lessons marked advisory-only, provenance retained", source: "@ears: EARS.01.03.b800" }
    - { rule: "Reflection triggers: >=10 unprocessed episodes OR 30 min elapsed since the first unprocessed episode OR an explicit reflect() call — never 'project end' alone (continuous agents have no project end)", source: "@bdd: BDD.01.03.d400" }
    - { rule: "Confidence dynamics: distiller assigns initial confidence in [0,1]; on each feedback outcome v (useful=1.0, not_useful=0.25, harmful=0.0): delta := clamp(c_base + 0.2*(v - c_base), 0, 1) - c_base where c_base := clamp(c - prev_applied_delta, 0, 1) on retrieval_id feedback revision (reversible applied_delta prevents drift); status:='advisory' when c < 0.4, restored to 'active' when c >= 0.5 (hysteresis); a 'harmful' outcome quarantines immediately for private scope='agent' and requires >= 2 distinct agent_id harmful votes on shared scopes (project/domain/space) to prevent cross-tenant/cross-agent DoS", source: "@ears: EARS.01.03.b800" }
    - { rule: "Secrets screen: before any episode or memory write, content is screened for credential material (key/token/password patterns + high-entropy strings); matches are rejected (or the span redacted) and an audit_records row is written", source: "@ears: EARS.01.04.c300" }
    - { rule: "reflect() summarizes via LLMPort.chat when configured, retries transient LLMPort.embed failures before committing reflected status, consolidate() compacts stale/duplicate memories and logs consolidation_runs, and run_worker_loop isolates per-agent/episode errors via DLQ", source: "@ears: EARS.01.03.d400" }
    - { rule: "ExperienceEvent validates ISO-8601 occurred_at, finite calibration_delta/effectiveness_score, screens occurred_at and domain_id through inspect_memory_write, and propagates caller scope into episode metadata", source: "@ears: EARS.01.03.e020" }
  state_transitions:
    - { from: "Episodes", to: "DistilledMemory", trigger: "reflection pass", source: "@bdd: BDD.01.03.d400" }
    - { from: "Lesson", to: "AdvisoryOnly", trigger: "confidence < floor", source: "@bdd: BDD.01.03.a700" }
  error_handling:
    - { condition: "LLM gateway unavailable", response: "Retry with backoff; no partial writes (at-least-once per episode, idempotent)", source: "@bdd: BDD.01.03.d400" }

implementation_notes:
  constraints: ["Idempotent per episode (content hash)", "No deletes — end-date/supersede", "Keep content_raw for re-embedding"]
  patterns: ["Reflection then periodic consolidation ('sleep')", "Pluggable MemoryPort engine over Postgres canonical"]
  performance_considerations: ["Batch LLM calls; cap consolidation working set"]

tdd_contracts:
  tdd_document: "@tdd: TDD-04"
  test_files:
    - { path: "tests/integration/test_distillation_embedding.py", covers: "episode -> memory reflection with embeddings" }
    - { path: "tests/integration/test_worker_runner.py", covers: "worker runner distillation loop and heartbeat" }
    - { path: "tests/unit/test_experience_pipeline.py", covers: "ExperienceEvent provenance propagation and effectiveness scoring" }
    - { path: "tests/security/test_wave_p1_integrity_runtime.py", covers: "brain_variant coalescing, consolidate(), and DLQ worker isolation" }

