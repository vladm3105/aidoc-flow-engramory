decision:
  decision_id: "DEC-CHG-008"
  title: "Adopt Derive-to-Text + Time/Region-Coded kb_sections + 3-Leg Hybrid RRF + Dual-Engine GraphRAG + 4 MiB Chunked COPY BINARY CAS"
  status: "Ratified"
  context: "Engramory requires multimodal knowledge ingestion (including 20 GB+ video) and hybrid vector + lexical BM25 + multi-hop graph retrieval without introducing a standalone S3 daemon."
  choice: "1) Store raw media blobs in PostgreSQL 18 kb_blobs / kb_blob_chunks (LOGGED <=50 MiB) / kb_blob_chunks_large (UNLOGGED >50 MiB to 25 GiB) via 4 MiB COPY BINARY streaming; 2) Derive structured text/transcripts/captions into kb_sections with modality, blob_sha256, blob_uri, media_metadata, and ts_lex GIN index; 3) Execute 3-leg RRF + Neo4j/PG CTE GraphRAG expansion."
  consequences: "Single-spine transactional governance, <=16 MiB peak Python streaming memory, and full multimodal GraphRAG across MCP and CLI."
  alternatives_considered:
    - option: "Inline base64 blobs in kb_sections or deploy standalone MinIO/SeaweedFS"
      rationale_rejected: "Violates Rule D14a/D14b and Decision D14 (MinIO prohibited; S3 daemon unjustified for internal CAS)."

