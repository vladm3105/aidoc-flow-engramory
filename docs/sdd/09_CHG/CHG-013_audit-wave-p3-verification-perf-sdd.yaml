decision:
  decision_id: DEC-CHG-013
  title: "Enforce >=85% Real-DB CI Verification, psycopg AsyncConnectionPool + 0013 Indexes, Profile Adapter Routing, Deep Immutability, Win32/Extraction Hardening, and 0-Violation SDD Graph Invariants (PLAN-026 Wave P3)"
  status: Ratified
  context: "AUDIT-2026-11-20_deep-review.md remaining Wave P3 findings cover DB connection pooling & index hygiene (M1), adapter/domain/lifecycle cleanup (M2), cross-platform portability (M4), extraction/parsing/git_sync/docs/stack/LLM bugs (M5), stale SDD/PRD/SPEC/IPLAN/graph parity (M8), test/CI coverage & real-DB verification (H16), anchored regex validation (L1), profile completeness & CLI init permissions (L3), deep immutability & layer-boundary placement (L4), plus scripts/deploy-stage.sh executable bit drift."
  choice: "Execute PLAN-026 TASK-4 under SDD2C (C2): archive SPEC-01/03/04/06/07 into docs/archive/CHG-013/ and reconcile ADR/SPEC/IPLAN docs first; move poisoning_guard to core/ with thin re-export shim and enforce deep immutability + \\A...\\Z fullmatch validation; add psycopg[binary,pool] lazy per-loop AsyncConnectionPool, SQL 0013 indexes/FK/RLS hygiene, non-mutating agent_brain_compare, unified adapter profile factory & clean worker shutdown; harden Win32 event loop/POSIX paths/CRLF lint, multimodal extractor bounds, MarkdownParser/HtmlParser/TextParser, git_sync upsert-before-delete, StackPolicyValidator, LiteLLM 16 MiB/dimensions, and SDD validate-graph --invariants zero violations; raise COV_MIN to 85% with real-DB PG18 + Neo4j integration coverage."
  consequences: "Closes all 39 AUDIT-2026-11-20_deep-review.md findings (Wave P0 + P1 + P2 + P3) locally on branch feature/plan-026-wave-p3-verification-perf-sdd with 0 SDD graph invariant violations and >=85% test coverage."
  alternatives_considered:
  - option: Keep asyncio-global single pool or defer SDD --invariants to warn-only
    rationale_rejected: Fails cross-loop CLI/pytest execution and leaves 9 unresolved SDD graph invariant violations in sdd:check.
