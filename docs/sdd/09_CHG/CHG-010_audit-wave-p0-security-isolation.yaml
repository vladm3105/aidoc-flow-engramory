decision:
  decision_id: DEC-CHG-010
  title: "Enforce PostgreSQL RLS, Scoped Graph/Vector Projection, Subprocess/Symlink Sandboxing, and Fail-Closed FastAPI MCP Auth (PLAN-026 Wave P0)"
  status: Ratified
  context: "AUDIT-2026-11-20_deep-review.md identified 9 Wave P0 security and isolation defects (C1-C8, H9): missing cross-tenant/agent authz on offboarding and feedback (C1, C2), single-vote harmful DoS on shared memories (C2), unconstrained Neo4j/PG graph traversals and un-scoped purge (C3), incomplete conflict predicates (C4), cross-tenant KB/runbook collisions (C5), shell=True smoke RCE (C6), spoofable stdlib HTTP / unauthenticated stdio / insecure OIDC fallback (C7), symlink traversal and poisoning-guard normalization bypasses (C8), and un-scoped VectorPort/1536-dim drift (H9)."
  choice: "Execute PLAN-026 TASK-1 under SDD2C (C2): amend EARS.01.03.b800, SPEC-01/02/04/06, and TDD-04 first; migrate schema in 0011_wave_p0_isolation_and_rls.sql with transaction-local app.tenant_id GUC across all 14 tables and non-owner roles; replace COPY BINARY on RLS tables with parameterized INSERT; migrate MCP HTTP transport to FastAPI/Starlette/Uvicorn with fail-closed OIDC/JWKS/revocation; sandbox docs smoke execution with shlex-allowlisted shell=False; and enforce atomic symlink/poisoning confinement."
  consequences: "Eliminates cross-tenant data leakage, shared-memory quarantine DoS, shell injection, symlink escape, and unauthenticated remote/stdio transport bypasses while preserving all documented 4-level Virtual Employee and Multimodal RAG APIs."
  alternatives_considered:
  - option: Application-layer-only tenant filtering without Postgres FORCE ROW LEVEL SECURITY
    rationale_rejected: Fails defense-in-depth requirements; a single missing WHERE predicate leaks cross-tenant records.
  - option: Retain BaseHTTPRequestHandler and manual JSON parsing in MCP server
    rationale_rejected: Vulnerable to HTTP smuggling/Slowloris and fails FastAPI/Starlette security middleware requirements in C7.
change_description:
  what: "Remediate all 9 Wave P0 findings (C1, C2, C3, C4, C5, C6, C7, C8, H9) across db/migrations/, src/engramory/, docs/, docs/sdd/, pyproject.toml, and tests/ per PLAN-026 TASK-1."
  why: "Close all critical tenant isolation, RCE, OIDC/MCP auth, graph/vector leakage, and symlink traversal vulnerabilities verified in AUDIT-2026-11-20_deep-review.md under EARS.01.03.b800, EARS.01.03.e020, EARS.01.03.a700, and EARS.01.04.c300."
  trigger: "Operator approval of PLAN-026 Wave P0 execution."
