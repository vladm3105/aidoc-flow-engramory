decision:
  decision_id: "DEC-CHG-007"
  title: "Adopt 4-part 5/5 remediation strategy: nats-py bounded drain, dual-subject matching, canonical docs/sdd consolidation, and additive migration 0009"
  status: "Ratified"
  context: "Post-consolidation audit surfaced SQL column mismatch on episodes (created_at vs ts), ExperienceEvent content_hash collisions, NatsEventsAdapter infinite stream hang, unscoped agent_profiles, and split-brain sdd/ vs docs/sdd/ trees."
  choice: "1) Add nats-py>=2.8.0 with bounded batch drain and P14/size guards; 2) Support both engramory.events.> and xp.engramory.experience.>; 3) Consolidate all SDD layers into docs/sdd/ with backward-compatible sdd fallback; 4) Add additive migration 0009 for tenant-scoped agent_profiles and ExperienceEvent deduplication."
  consequences: "Full multi-tenant isolation, non-blocking worker event draining, deterministic ExperienceEvent deduplication, and single-source-of-truth SDD tree."
  alternatives_considered:
    - option: "Mutate baseline migration 0001 in-place or keep dual sdd/ and docs/sdd/ directories"
      rationale_rejected: "Breaks forward-only migration parity on Stage and perpetuates split-brain SDD validation."

