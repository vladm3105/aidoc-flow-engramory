decision:
  decision_id: "DEC-CHG-006"
  title: "Retire aidoc-flow-interlog and absorb its 4 domain contracts into platform-engramory and platform-observability-monitoring"
  status: "Ratified"
  context: "aidoc-flow-interlog duplicated operational telemetry (now in platform-observability-monitoring) and agent memory ingestion (now in platform-engramory + platform-nats), but held valuable domain schemas for deterministic UUIDv5 deduplication, OriginProvenance, 9 milestone event kinds, and learning effectiveness scoring."
  choice: "Absorb the 4 domain contracts into platform-engramory (core/experience.py, NatsEventsAdapter, distillation provenance propagation) and platform-observability-monitoring (ClickHouse views + two-plane architecture docs), then archive aidoc-flow-interlog."
  consequences: "Unified two-plane architecture (OTLP telemetry vs. NATS/MCP memory) with zero Git push contention and end-to-end W3C trace_id correlation."
  alternatives_considered:
    - option: "Retain aidoc-flow-interlog as an intermediary SDK and GitTransport hub"
      rationale_rejected: "Creates a 5-attempt git fetch/rebase/push bottleneck on main and duplicates OTLP and NATS transport layers."

