  summary: "Implement PLAN-020 phases 1-6 to absorb aidoc-flow-interlog domain contracts into platform-engramory and platform-observability-monitoring and formally archive aidoc-flow-interlog."
  why: "Eliminate architectural overlap and Git push contention while preserving deterministic event deduplication, origin provenance, and closed-loop learning telemetry."
