decision:
  decision_id: DEC-CHG-011
  title: "Enforce CAS Advisory Locks & kb_blob_projects RLS, Durable JetStream Pull Consumers, Unified AccessSurface CLI/Passport Governance, and Runtime Parser/Context Hardening (PLAN-026 Wave P1)"
  status: Ratified
  context: "AUDIT-2026-11-20_deep-review.md identified 14 Wave P1 data-integrity, async runtime, and boundary defects (C9-C10, H1-H8, H10-H12, H15): GitSyncEngine ADDED deletion crash and pre-validation CAS writes (C9); unguarded CAS concurrent overwrite race, project metadata leak, broken put(key), and unbounded blob_get (C10); Core NATS 50ms polling loss and worker tenant spoofing (H1); brain_variant duplicate loop, stubbed LLM distillation/consolidation, and worker starvation (H2); Brain Passport integrity overrides, redaction gaps, and 100-row dedup truncation (H3); ExperienceEvent producer spoofing, missing scope metadata, NaN crash, and episode index collision (H4); department_focus and runbook/media ingestion bypasses (H5); 6 CLI subcommands bypassing AccessSurface (H6); MCP blocking loop starvation, 64 KiB stdio hang, ping/notification/readOnlyHint/digest bugs (H7); 64 KiB PDF truncation, sniffing order, cross-tenant Docling cache, empty section crashes, and missing SDD/ADR stubs (H8); Neo4j $props overwrite and ':' UID collision (H10); fail-open SDD drift/invariants and dead GRAPH-CARD-001 (H11); memory_learning_health agent leak, dead ts_lex, break starvation, and stale KB vectors (H12); and unsafe ScopedContractResolver sibling default + RAM-only LocalFsStorageAdapter (H15)."
  choice: "Execute PLAN-026 TASK-2 under SDD2C (C2): snapshot and update SPEC-01/02/04/06/07 first; add reversible migration 0012 (kb_blob_projects + kb_blob_aliases + RLS backfill and rescoped uq_episodes_event_id); harden CAS locking, LocalFsStorageAdapter disk persistence, GitSyncEngine, NatsEventsAdapter JetStream pull consumers, Distillation/Consolidation + MemoryCore, Brain Passports, ExperienceEvent, AccessSurface/CLI/MCP parity, Neo4j $props/UIDs, Extraction/Parsers, and ContextTools without touching Wave P2 protected files or adding unapproved dependencies."
  consequences: "Closes all 14 Wave P1 data-integrity, concurrency, NATS JetStream, passport, CLI/MCP parity, extraction, and graph projection defects with full test and governed docs alignment."
  alternatives_considered:
  - option: Drop cross-project CAS deduplication and store duplicate blobs per project
    rationale_rejected: Wastes storage across multi-project tenants; kb_blob_projects preserves CAS dedup safely with per-project metadata isolation under RLS.
  - option: Defer JetStream pull consumers and CLI AccessSurface routing to Wave P3
    rationale_rejected: Leaves 99.98% Core NATS event loss and un-audited CLI governance paths active.
change_description:
  what: "Remediate all 14 Wave P1 findings (C9, C10, H1, H2, H3, H4, H5, H6, H7, H8, H10, H11, H12, H15) across db/migrations/, src/engramory/, docs/, docs/sdd/, and tests/ per PLAN-026 TASK-2."
  why: "Close CAS concurrency races, GitSync crashes, Core NATS event loss, brain variant duplication, Brain Passport integrity gaps, ExperienceEvent spoofing, CLI/MCP parity bypasses, extraction bombs, Neo4j property/UID collisions, and fail-open SDD gates."
  trigger: "Operator continuation approval after Wave P0 (CHG-010) completion."
