decision:
  decision_id: "DEC-CHG-009"
  title: "Adopt 4-Level ADR-07 Virtual Employee Hierarchy, Multi-Agent Archetype & Specialization Taxonomy, Multi-Model Brain Variants, and SHA-256 Sanitized Brain Passports"
  status: "Ratified"
  context: "A multi-agent fleet (e.g. 10 agent-support, 5 agent-pm, 5 agent-dev instances) requires per-instance private experience, shared department/project knowledge without O(N*M) memory duplication, multi-model distillation comparison, and sanitized cross-tenant brain portability."
  choice: "1) Use ADR-07 4-level visibility (agent -> project -> domain -> space) with end-to-end domain_id and specialization filtering; 2) Track agent_type, specializations, and brain_config in L3 agent_profiles and L2 memories.provenance; 3) Support parallel brain_variant distillation and agent_brain_compare; 4) Enforce mandatory passport_sha256, recursive PII sanitization, and agent_type compatibility on Brain Passports alongside transactional agent_space_offboard."
  consequences: "O(1) memory footprint across multi-instance fleets, deterministic specialist discovery/ranking, verifiable multi-model A/B benchmarking, and zero-PII cross-tenant specialist mobility."
  alternatives_considered:
    - option: "Physical N-way replication of distilled skills across all support agent instances"
      rationale_rejected: "Multiplies PostgreSQL storage, HNSW index RAM, and prompt token costs by 10x and pollutes unrelated specialists."

