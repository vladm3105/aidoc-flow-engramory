  what: "Remediate all 8 Wave P2 findings (C11, H13, H14, M3, M6, M7, L2, L5) across .aidoc/, .github/, .vale/, config/, docs/, portal/, scripts/, skills/, src/engramory/, tests/, compose files, Dockerfile, Makefile, mise.toml, pyproject.toml, uv.lock, Taskfile.yml, and unified-test-suite.config.json per PLAN-026 TASK-3."
  why: "Resolve container/PG18/compose/secret-custody defects, AGPL licensing & stack-policy mismatch, fabricated harness lockfile hashes, non-buildable portal & port 8005 conflict, silent-skip sdd:check, stale retired-tool rules, and CI workflow/promotion gate bypasses."
  trigger: "Operator approval of all Wave P2 approval-gate recommended items (Items A/A1, B1-B3, C1-C2, D; Item 0 & Item E flagged)."
