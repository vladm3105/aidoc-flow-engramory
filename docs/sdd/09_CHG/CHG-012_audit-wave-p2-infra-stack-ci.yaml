decision:
  decision_id: DEC-CHG-012
  title: "Reconcile Stack Policy, Fail-Closed Stage EaC Stub, Hardened Compose/Dockerfile, Ready/Heartbeat Probes, Astro Starlight Portal & Pinned Split-Forge CI Gates (PLAN-026 Wave P2)"
  status: Ratified
  context: "AUDIT-2026-11-20_deep-review.md identified 8 Wave P2 infra, supply-chain, packaging, portal, and CI/governance findings (C11, H13, H14, M3, M6, M7, L2, L5). Operator approved all recommended items (Items A/A1, B1-B3 for pypdf/ffmpeg/pip-audit, C1-C2 tracked PLAN-026 amendments, and D fail-closed scripts/deploy-stage.sh retirement) with two hard gates: (1) Item 0 requires privatizing vladm3105/aidoc-flow-engramory before pushing self-hosted PR workflows; (2) Item E flags cross-repo platform-stage-ops OpenTofu/pyinfra EaC migration as a separate operator-initiated PR without modifying external repositories here."
  choice: "Execute PLAN-026 TASK-3 under SDD2C (C3): archive and update SPEC-01/06/07 first; apply operator-approved stack-policy and pyproject.toml unification (replacing AGPL-3.0 pymupdf with BSD-3-Clause pypdf); add 'stage' profile to factory.py and auth.int.aiops-flow.io defaults in cli.py; add bounded /health & /ready dependency probes on McpServer + startup/periodic heartbeat ticks in runner.py; harden docker-compose.yml, compose.platform.yaml, docker-compose.telemetry-net.yml, Dockerfile, Makefile, and config/litellm.config.yaml; fail-closed retire scripts/deploy-stage.sh; harden scripts/secret_scan.py, scripts/pre_push_guard.sh, scripts/ingest_docs.py; regenerate authentic .aidoc/harness.lock.json digests; fix .aidoc/Taskfile.yml fail-closed sdd:check (with --invariants deferred to CHG-013), BANNED_RETIRED_TOOLS & Vale parity (C1), Astro Starlight portal scaffold on port 4321 + portal_builder title injection & orphan pruning, and approved protected CI workflows + .ci-config + .gitleaks.toml."
  consequences: "Closes all 8 Wave P2 findings on the feature branch with zero unapproved dependencies, authentic harness lockfile checksums, buildable Astro Starlight portal, hardened secret scanner and containers, and pinned CI gates ready for post-privatization push and companion platform-stage-ops rollout."
  alternatives_considered:
  - option: Retain imperative scripts/deploy-stage.sh or allow public-repo self-hosted runners
    rationale_rejected: Violates global EaC mandate, fails against removed plaintext secrets in compose.platform.yaml, and exposes self-hosted runners on public fork PRs.
  - option: Remove bytebase from BANNED_RETIRED_TOOLS literally per PLAN-026:230
    rationale_rejected: Authoritative platform-technology_stack/25-approved-tooling-inventory.md:112 marks both bytebase and seaweedfs Hold/Retired; approved amendment C1 retains both and updates their stale replacement strings.
