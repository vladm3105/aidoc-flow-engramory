# =============================================================================
# Registry Update Triggers
# =============================================================================
update_triggers:
  _guidance: "When to update this registry. Enforced at GATE-03 and GATE-SPEC."
  on_adr_created:
    - "Add entry to adrs with status: Proposed"
    - "Increment metadata.total_adrs"
  on_adr_accepted:
    - "Update status to Accepted with status_date"
    - "If ADR involves technology selection, add/update entry in technologies"
    - "Increment metadata.total_technologies"
  on_adr_superseded:
    - "Update status to Superseded, record superseded_by"
    - "Update affected technologies lifecycle_status to Deprecated or Sunset"
  on_technology_added:
    - "Add entry to technologies with authorizing_decision, PURL/CPE, and update_policy"
    - "Verify technology complies with Tier-0 Enterprise Baseline or has approved ADR exception"
  on_technology_updated:
    - "Update version_constraint, purl, and audit date"
