# Attest bot PRs: bots cannot run `task ship`, so no local-CI signoff is ever
# posted for them. This workflow records policy acceptance as the `signoff`
# status for same-repo PRs from `[bot]`-suffixed authors plus the `dependabot/`
# and `renovate/` branch prefixes (Gitea exposes no author type, so prefixes
# carry the Gitea side — probed live). The meaningful gates for bot PRs are
# the other required checks (integration-source, composite scans). Never add
# this job's own context to a required set — that would be self-attestation.
# Bot branches on other prefixes get no automatic signoff — check the branch
# out and `task ship` it (local CI signs any branch).
# Gitea twin of templates/github/workflows/bot-signoff.yml: curl instead of
# gh (no gh on Gitea runners); no target_url. Installed when the target
# forge is gitea (install.sh --forge gitea or a Gitea remote).
name: Bot signoff

'on':
  pull_request:
    branches: ["dev", "staging", "main"]
    types: [opened, synchronize, reopened]

# NOTE: no 'permissions:' block — Gitea restricts the automatic token when
# one is present (statuses POST gets 403); omission posts fine (201, live).
jobs:
  bot-signoff:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/')) &&
      (endsWith(github.event.pull_request.user.login, '[bot]') || github.event.pull_request.user.login == 'dependabot' || github.event.pull_request.user.login == 'renovate') ||
      endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: [self-hosted, ci, ephemeral]
    steps:
      - name: Attest bot PR
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          cfg=$(mktemp "${RUNNER_TEMP:-/tmp}/curl-auth.XXXXXX")
          trap 'rm -f "$cfg"' EXIT
          chmod 0600 "$cfg"
          printf 'header = "Authorization: token %s"\n' "$TOKEN" > "$cfg"
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST \
            --config "$cfg" -H 'Content-Type: application/json' \
            -d '{"state":"success","context":"signoff","description":"bot PR attested by policy (server checks still apply)"}' \
            "$SERVER/api/v1/repos/$REPO/statuses/$SHA") || exit 1
          test "$code" = 201 || exit 1
          rcode=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST \
            --config "$cfg" -H 'Content-Type: application/json' \
            -d '{"state":"success","context":"review","description":"bot PR exempt from AI review per policy"}' \
            "$SERVER/api/v1/repos/$REPO/statuses/$SHA") || exit 1
          test "$rcode" = 201 || exit 1
