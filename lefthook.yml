# aidoc-hybrid-ci git hooks. Hooks call `task` / `.ci/bin` / `scripts/` only.
pre-commit:
  parallel: true
  commands:
    check:
      run: task check
    secrets:
      run: bash .ci/bin/secrets --staged

pre-push:
  commands:
    guard:
      run: if [[ -f scripts/pre_push_guard.sh ]]; then bash scripts/pre_push_guard.sh {remote} {url}; else task ci; fi
