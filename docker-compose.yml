# Engramory — Phase 0 dev stack (all permissive open-source).
# Cloud migration = swap these for managed services behind the same ports.
name: engramory

services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: engramory-postgres
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engramory}
      POSTGRES_USER: ${POSTGRES_USER:-engramory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-local-pg}
    # Bound to loopback 127.0.0.1; override host port via POSTGRES_HOST_PORT in .env.
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - pgblob_ts:/var/lib/postgresql/blob_ts
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engramory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8-alpine
    container_name: engramory-valkey
    ports: ["127.0.0.1:${VALKEY_PORT:-6379}:6379"]
    volumes: ["valkeydata:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: engramory-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-4222}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:0.31.2
    ports: ["127.0.0.1:${OLLAMA_PORT:-11434}:11434"]
    volumes: ["ollamadata:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # Optional local gateway; default connects to shared LiteLLM (http://10.250.0.1:4001/v1).
    profiles: ["local-ai"]
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    depends_on:
      ollama:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-dev-local-master}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    ports: ["127.0.0.1:${LITELLM_PORT:-4000}:4000"]
    volumes:
      - ./config/litellm.config.yaml:/app/config.yaml:ro

  neo4j:
    image: neo4j:5.26-community
    container_name: engramory-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-dev-local-neo4j}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidoc-engramory-mcp:dev
    container_name: engramory-mcp
    entrypoint: ["engramory", "mcp", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENGRAMORY_DATABASE_URL: postgresql://${POSTGRES_USER:-engramory}:${POSTGRES_PASSWORD:-dev-local-pg}@postgres:5432/${POSTGRES_DB:-engramory}
      ENGRAMORY_GRAPH_URL: bolt://neo4j:7687
      ENGRAMORY_GRAPH_USER: ${NEO4J_USER:-neo4j}
      ENGRAMORY_GRAPH_PASSWORD: ${NEO4J_PASSWORD:-dev-local-neo4j}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev-local-neo4j}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-dev-local-litellm}
      ENGRAMORY_EMBED_MODEL: ${ENGRAMORY_EMBED_MODEL:-embed}
      ENGRAMORY_EMBED_DIMS: ${ENGRAMORY_EMBED_DIMS:-1536}
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: aidoc-engramory-worker:dev
    container_name: engramory-worker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      nats:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ENGRAMORY_DATABASE_URL: postgresql://${POSTGRES_USER:-engramory}:${POSTGRES_PASSWORD:-dev-local-pg}@postgres:5432/${POSTGRES_DB:-engramory}
      ENGRAMORY_PROFILE: dev
      ENGRAMORY_REFLECT_INTERVAL_SEC: ${ENGRAMORY_REFLECT_INTERVAL_SEC:-300}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dev-local-neo4j}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-dev-local-litellm}
      ENGRAMORY_EMBED_MODEL: ${ENGRAMORY_EMBED_MODEL:-embed}
      ENGRAMORY_EMBED_DIMS: ${ENGRAMORY_EMBED_DIMS:-1536}
    restart: unless-stopped

volumes:
  pgdata:
  pgblob_ts:
  valkeydata:
  ollamadata:
  neo4jdata:
