# Engramory — Phase 0 dev stack (all free / open-source).
# Cloud migration = swap these for managed services behind the same ports.
name: engramory

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engramory}
      POSTGRES_USER: ${POSTGRES_USER:-engramory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    # Published port is overridable: hosts where 5432 is taken set
    # POSTGRES_HOST_PORT (e.g. in .env) — see docs/INSTALL.md (PLAN-002 2.0).
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engramory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: engramory-seaweedfs
    command: "weed server -dir=/data -s3 -s3.port=9000 -filer -filer.port=8888 -volume.max=5 -master.volumeSizeLimitMB=1024"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    restart: unless-stopped

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: engramory-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      echo 's3.bucket.create -name ${S3_BUCKET:-engramory}' | weed shell -master=seaweedfs:9333;
      echo 'Bucket ${S3_BUCKET:-engramory} initialized successfully.';
      "
    restart: "no"

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:0.31.2
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    # Optional local mock: by default, connect to Stage (http://100.98.134.10:4001)
    # or Dev shared LiteLLM (http://localhost:4000)
    profiles: ["local-ai"]
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    depends_on:
      ollama:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-change_me}
    ports: ["4000:4000"]
    volumes:
      - ./config/litellm.config.yaml:/app/config.yaml:ro

  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change_me}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]

  keycloak:
    # Deprecated in platform standard (Authentik is authoritative IdP, Doc 27)
    profiles: ["legacy-idp"]
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change_me}
    ports: ["8080:8080"]
    volumes: ["keycloakdata:/opt/keycloak/data"]

volumes:
  pgdata:
  redisdata:
  seaweedfs-data:
  ollamadata:
  neo4jdata:
  keycloakdata:
