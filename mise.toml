# aidoc-hybrid-ci toolchain pins — the same versions locally, in agent sandboxes and in
# GitHub Actions (jdx/mise-action). Universal-tool pins carried over from aidoc-flow-ci v4.
# Every tool is pinned to an exact version for reproducible CI (`task doctor` warns on any `latest`).
[tools]
task = "3.53.1"
jq = "1.8.1"
gh = "2.102.0"
lefthook = "1.13.5"
gitleaks = "8.30.1"
"pipx:semgrep" = "1.170.0"
"npm:markdownlint-cli2" = "0.23.0"
lychee = "0.24.2"
"pipx:yamllint" = "1.38.0"
actionlint = "1.7.12"
shellcheck = "0.10.0"
osv-scanner = "2.4.0"
trivy = "0.75.0"

# python
python = "3.14"
uv = "0.9.0"
