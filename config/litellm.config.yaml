# LiteLLM gateway — single OpenAI-compatible endpoint for all models.
# Postgres schema enforces vector(1536); all configured `embed` targets emit 1536d vectors.
# In cloud/prod, swap model entries with Vertex AI or Azure OpenAI deployments.
model_list:
  - model_name: chat
    litellm_params:
      model: ollama/llama3.1
      api_base: http://ollama:11434
  - model_name: embed
    litellm_params:
      model: openai/qwen/qwen3-embedding-8b
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        dimensions: 1536

litellm_settings:
  drop_params: true

