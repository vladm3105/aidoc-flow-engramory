# ==============================================================================
# Stage: Engramory memory & knowledge core in the `platform` rootless Docker
# namespace (UID 1004). Attaches directly to `platform-mesh` alongside
# stage-postgres18, stage-neo4j, stage-nats, aidoc-litellm-proxy, and otel-collector.
#
# Secret custody (OpenBao Path C): secrets MUST be injected at runtime via
# OpenBao `/dev/shm/openbao-env.sh` (0600) or fail-closed `${VAR:?}` exports
# managed by platform-stage-ops OpenTofu / pyinfra. Zero plaintext defaults.
# ==============================================================================

name: platform-engramory

services:
  mcp:
    image: aidoc-engramory-mcp:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engramory-mcp
    entrypoint: ["engramory", "mcp", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    ports:
      - "127.0.0.1:${MCP_PORT:-8005}:8000"
    environment:
      - ENGRAMORY_DATABASE_URL=${ENGRAMORY_DATABASE_URL:?OpenBao secret required}
      - ENGRAMORY_BLOB_DSN=${ENGRAMORY_BLOB_DSN:?OpenBao secret required}
      - ENGRAMORY_GRAPH_URL=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - ENGRAMORY_GRAPH_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - ENGRAMORY_GRAPH_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:?OpenBao secret required}
      - NEO4J_URI=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - NEO4J_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - NEO4J_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:?OpenBao secret required}
      - NATS_URL=${NATS_URL:-nats://stage-nats:4222}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://aidoc-litellm-proxy:4000/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:?OpenBao secret required}
      - ENGRAMORY_EMBED_MODEL=${ENGRAMORY_EMBED_MODEL:-embed}
      - ENGRAMORY_EMBED_DIMS=${ENGRAMORY_EMBED_DIMS:-1536}
      - ENGRAMORY_PROFILE=${ENGRAMORY_PROFILE:-stage}
      - ENGRAMORY_ALLOWED_DOCS_ROOT=${ENGRAMORY_ALLOWED_DOCS_ROOT:-/workspace}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=engramory-mcp
      - AUTHENTIK_ENABLED=${AUTHENTIK_ENABLED:-true}
      - AUTHENTIK_JWKS_URL=${AUTHENTIK_JWKS_URL:-https://auth.int.aiops-flow.io/application/o/engramory/jwks/}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER:-https://auth.int.aiops-flow.io/application/o/engramory/}
      - AUTHENTIK_AUDIENCE=${AUTHENTIK_AUDIENCE:-engramory}
      - SECURITY_GATE_URL=${SECURITY_GATE_URL:-http://security-gate:8095}
    volumes:
      - ${HOST_SPOKE_DEV_PATH:-/opt/data}:/workspace:ro
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    image: aidoc-engramory-worker:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engramory-worker
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 256
    environment:
      - ENGRAMORY_DATABASE_URL=${ENGRAMORY_DATABASE_URL:?OpenBao secret required}
      - ENGRAMORY_BLOB_DSN=${ENGRAMORY_BLOB_DSN:?OpenBao secret required}
      - ENGRAMORY_GRAPH_URL=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - ENGRAMORY_GRAPH_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - ENGRAMORY_GRAPH_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:?OpenBao secret required}
      - NEO4J_URI=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - NEO4J_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - NEO4J_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:?OpenBao secret required}
      - NATS_URL=${NATS_URL:-nats://stage-nats:4222}
      - ENGRAMORY_PROFILE=${ENGRAMORY_PROFILE:-stage}
      - ENGRAMORY_REFLECT_INTERVAL_SEC=${ENGRAMORY_REFLECT_INTERVAL_SEC:-300}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://aidoc-litellm-proxy:4000/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:?OpenBao secret required}
      - ENGRAMORY_EMBED_MODEL=${ENGRAMORY_EMBED_MODEL:-embed}
      - ENGRAMORY_EMBED_DIMS=${ENGRAMORY_EMBED_DIMS:-1536}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=engramory-worker
    networks:
      - platform-mesh
    restart: unless-stopped

networks:
  platform-mesh:
    external: true
