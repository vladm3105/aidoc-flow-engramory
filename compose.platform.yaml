# ==============================================================================
# Stage: Engramory memory & knowledge core in the `platform` rootless Docker
# namespace (UID 1004). Attaches directly to `platform-mesh` alongside
# stage-postgres18, stage-neo4j, aidoc-litellm-proxy, and otel-collector.
#
# Usage as platform user:
#   docker compose -f compose.platform.yaml up -d
# ==============================================================================

name: platform-engramory

services:
  mcp:
    image: aidoc-engramory-mcp:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engramory-mcp
    entrypoint: ["engramory", "mcp", "--transport", "sse", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${MCP_PORT:-8005}:8000"
    environment:
      - ENGRAMORY_DATABASE_URL=${ENGRAMORY_DATABASE_URL:-postgresql://engramory:change_me@stage-postgres18:5432/engramory}
      - ENGRAMORY_GRAPH_URL=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - ENGRAMORY_GRAPH_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - ENGRAMORY_GRAPH_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:-stage_graph_secret_2026}
      - NEO4J_URI=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - NEO4J_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - NEO4J_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:-stage_graph_secret_2026}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://aidoc-litellm-proxy:4000/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-platform-token}
      - ENGRAMORY_PROFILE=${ENGRAMORY_PROFILE:-stage}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=engramory-mcp
      - AUTHENTIK_ENABLED=${AUTHENTIK_ENABLED:-true}
      - AUTHENTIK_JWKS_URL=${AUTHENTIK_JWKS_URL:-https://auth-stage.aiops-flow.io/application/o/engramory/jwks/}
      - AUTHENTIK_ISSUER=${AUTHENTIK_ISSUER:-https://auth-stage.aiops-flow.io/application/o/engramory/}
      - AUTHENTIK_AUDIENCE=${AUTHENTIK_AUDIENCE:-engramory}
      - SECURITY_GATE_URL=${SECURITY_GATE_URL:-http://security-gate:8095}
      - SECURITY_AUDIT_LOG_PATH=${SECURITY_AUDIT_LOG_PATH:-/var/spool/interlog/security-audit.jsonl}
    volumes:
      - ${HOST_SPOKE_DEV_PATH:-/opt/data}:/workspace:ro
      - ${SECURITY_AUDIT_SPOOL_DIR:-/tmp/interlog}:/var/spool/interlog
    networks:
      - platform-mesh
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: aidoc-engramory-worker:staging
    build:
      context: .
      dockerfile: Dockerfile
    container_name: engramory-worker
    environment:
      - ENGRAMORY_DATABASE_URL=${ENGRAMORY_DATABASE_URL:-postgresql://engramory:change_me@stage-postgres18:5432/engramory}
      - ENGRAMORY_GRAPH_URL=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - ENGRAMORY_GRAPH_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - ENGRAMORY_GRAPH_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:-stage_graph_secret_2026}
      - NEO4J_URI=${ENGRAMORY_GRAPH_URL:-bolt://stage-neo4j:7687}
      - NEO4J_USER=${ENGRAMORY_GRAPH_USER:-neo4j}
      - NEO4J_PASSWORD=${ENGRAMORY_GRAPH_PASSWORD:-stage_graph_secret_2026}
      - ENGRAMORY_PROFILE=${ENGRAMORY_PROFILE:-stage}
      - ENGRAMORY_REFLECT_INTERVAL_SEC=${ENGRAMORY_REFLECT_INTERVAL_SEC:-300}
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-http://aidoc-litellm-proxy:4000/v1}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-sk-platform-token}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - OTEL_SERVICE_NAME=engramory-worker
    networks:
      - platform-mesh
    restart: unless-stopped

networks:
  platform-mesh:
    external: true

