name: labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/labeler.yml@845964a439747001b5e3febbeebde4aa5a551d20 # ci/v1.9.5
    permissions:
      contents: read
      pull-requests: write
    with:
      runner_labels: '["self-hosted", "ci", "ephemeral"]'
