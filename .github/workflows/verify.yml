# aidoc-hybrid-ci — server-side verification (thin layer).
# Job name "verify" is required for promotion (PROMOTION_REQUIRED_CHECKS) — keep it stable.
# ANTI-DEADLOCK INVARIANT: never add `paths:` / `paths-ignore:` under `on:` in this workflow.
name: verify
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [staging, main]

permissions:
  contents: read
  checks: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, ci, ephemeral]
    timeout-minutes: 30
    env:
      GITLEAKS_LOG_OPTS: "--all"
      CI_ROUTING: "off"
      CI_TAIL: "200"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - id: reuse
        name: Reuse an identical, already verified tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_REF: ${{ github.base_ref || github.event.pull_request.base.ref }}
        run: |
          hit=false
          if [ -n "$BASE_REF" ] && git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            trusted_helper="$(git show "origin/$BASE_REF:.ci/bin/verify-reuse" 2>/dev/null || true)"
            if [ -n "$trusted_helper" ] \
               && [ "$(git rev-parse "HEAD^{tree}")" = "$(git rev-parse "$HEAD_SHA^{tree}")" ] \
               && parent=$(printf '%s' "$trusted_helper" | bash -s -- "$HEAD_SHA"); then
              hit=true
              echo "verify: tree of ${HEAD_SHA:0:12} already verified on ${parent:0:12}; reusing"
            fi
          fi
          echo "hit=$hit" >> "$GITHUB_OUTPUT"
      - if: steps.reuse.outputs.hit != 'true'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - if: steps.reuse.outputs.hit != 'true'
        name: Verify vendored CI integrity & toolchain (GitHub-only split-forge clone safe)
        run: |
          (cd .ci && sha256sum -c MANIFEST.sha256 >/dev/null)
          for t in uv task semgrep gitleaks trivy osv-scanner actionlint yamllint shellcheck; do
            command -v "$t" >/dev/null || { echo "verify: missing tool '$t'" >&2; exit 1; }
          done
      - if: steps.reuse.outputs.hit != 'true'
        run: task deps
      - if: steps.reuse.outputs.hit != 'true'
        run: task ci-full
      - name: Upload CI results (audit trail)
        if: always() && steps.reuse.outputs.hit != 'true'
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: ci-results-${{ github.sha }}
          path: .ci-out/
          retention-days: 90

  release-tag-verify:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: [self-hosted, ci, ephemeral]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify release tag descends from origin/main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "Release tag ${GITHUB_REF_NAME} verified on main; rollout proceeds via platform-stage-ops OpenTofu PR."
