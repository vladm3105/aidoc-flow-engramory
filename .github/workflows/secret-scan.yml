name: secret-scan
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/secret-scan.yml@845964a439747001b5e3febbeebde4aa5a551d20 # ci/v1.9.5
    with:
      runner_labels: '["self-hosted", "ci", "ephemeral"]'
