# aidoc-hybrid-ci — nightly dependency vulnerability audit (new CVEs appear without code changes).
name: nightly-audit
'on':
  schedule:
    - cron: '17 7 * * *'   # daily 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, ci, ephemeral]
    timeout-minutes: 20
    env:
      CI_TAIL: "200"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - run: task deps
      - run: task audit
      # Opt-in verified secret scan (set the TRUFLEHOG_VERIFY repo/org variable to 'true';
      # absent skips). Filesystem scan, verified findings only, no provisioned secret needed.
      - if: vars.TRUFLEHOG_VERIFY == 'true'
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb  # v3.99.8
        with:
          path: ./
          extra_args: --only-verified
      - if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: audit-${{ github.run_id }}
          path: .ci-out/
          retention-days: 30
