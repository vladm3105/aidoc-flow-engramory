# Caller for aidoc-flow-ci's reusable docs-sync workflow.
# DRY-RUN rollout: computes proposed mechanical doc-fixes post-merge and comments on PR.
name: docs-sync

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  call:
    uses: vladm3105/aidoc-flow-ci/.github/workflows/docs-sync.yml@845964a439747001b5e3febbeebde4aa5a551d20 # ci/v1.9.5
    with:
      runner_labels: '["self-hosted", "ci", "ephemeral"]'
