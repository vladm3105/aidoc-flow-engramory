# standards-drift — weekly server-side canon drift check (product-code tier).
# Pinned to immutable aidoc-flow-ci commit SHA with SHA-256 verification of the downloaded script.

name: standards-drift

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check-standards-drift
    runs-on: [self-hosted, ci, ephemeral]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and verify drift-check script
        run: |
          mkdir -p sync
          SHA="e827ab8268917ea4a81a0b8ddbc59eace702f7ed"
          EXPECTED="0862ada5640083787c324fd88d7033d8825b1e70d7b6ea2240e609acc7e7b257"
          URL="https://raw.githubusercontent.com/vladm3105/aidoc-flow-ci/${SHA}/sync/check-standards-drift.sh"
          curl -fsSL "$URL" -o sync/check-standards-drift.sh
          printf '%s  sync/check-standards-drift.sh\n' "$EXPECTED" | sha256sum -c -
          chmod +x sync/check-standards-drift.sh

      - name: Run standards drift check (tier=product)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash sync/check-standards-drift.sh --tier product
