# Attest bot PRs: bots cannot run `task ship`, so no local-CI signoff is ever
# posted for them. This workflow records policy acceptance as the `signoff`
# status for same-repo PRs from `[bot]`-suffixed authors plus the `dependabot/`
# and `renovate/` branch prefixes (Gitea exposes no author type, so prefixes
# carry the Gitea side — probed live). The meaningful gates for bot PRs are
# the other required checks (integration-source, composite scans). Never add
# this job's own context to a required set — that would be self-attestation.
# Bot branches on other prefixes get no automatic signoff — check the branch
# out and `task ship` it (local CI signs any branch).
name: Bot signoff

'on':
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened]

permissions:
  statuses: write

jobs:
  bot-signoff:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((startsWith(github.head_ref, 'dependabot/') || startsWith(github.head_ref, 'renovate/')) &&
      (endsWith(github.event.pull_request.user.login, '[bot]') || github.event.pull_request.user.login == 'dependabot' || github.event.pull_request.user.login == 'renovate') ||
      endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: [self-hosted, ci, ephemeral]
    steps:
      - name: Attest bot PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=signoff \
            -f description="bot PR attested by policy (server checks still apply)" \
            -f target_url="https://github.com/$REPO/actions" || exit 1
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=review \
            -f description="bot PR exempt from AI review per policy" \
            -f target_url="https://github.com/$REPO/actions" || exit 1
