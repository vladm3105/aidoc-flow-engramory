# Attest bot PRs on dev only for dependabot/ and renovate/ prefixes.
name: Bot signoff

'on':
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions:
  statuses: write

jobs:
  bot-signoff:
    timeout-minutes: 5
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'dev' &&
      (startsWith(github.head_ref, 'dependabot/') ||
       startsWith(github.head_ref, 'renovate/')) &&
      (endsWith(github.event.pull_request.user.login, '[bot]') ||
       github.event.pull_request.user.login == 'dependabot' ||
       github.event.pull_request.user.login == 'renovate')
    runs-on: [self-hosted, ci, ephemeral]
    steps:
      - name: Attest bot PR
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=signoff \
            -f description="bot PR attested by policy (server checks still apply)" \
            -f target_url="https://github.com/$REPO/actions" || exit 1
          gh api "repos/$REPO/statuses/$SHA" -f state=success -f context=review \
            -f description="bot PR exempt from AI review per policy" \
            -f target_url="https://github.com/$REPO/actions" || exit 1
